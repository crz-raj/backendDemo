name: Rollback Backend NEW

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to rollback to (example: v2026.02.17.1)'
        required: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NEW branch
        uses: actions/checkout@v4
        with:
          ref: chat
          fetch-depth: 0

      - name: Rollback to Release Tag
        run: |
          TAG=${{ github.event.inputs.release_tag }}
          echo "Rolling back backend NEW (chat) to $TAG"
          git reset --hard $TAG
          git push origin chat --force

      - name: Deployment after rollback
        run: |
          echo "Deploying backend NEW after rollback to $TAG"
          # Add your actual deployment commands here
